services:
  # ----------------------------------------------------------------------------
  # 1. CallMind (Default Universal CPU)
  # ----------------------------------------------------------------------------
  callmind:
    image: ghcr.io/callmind/callmind:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ACCELERATION: cpu
    container_name: callmind-server
    # Longer than the binary's own worker-shutdown wait, so the requeue of
    # in-flight jobs actually runs before Docker sends SIGKILL. Docker's
    # default is 10s, which raced the requeue exactly.
    stop_grace_period: 30s
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./callmind.yaml:/app/callmind.yaml:ro
    environment:
      - RUST_LOG=info
      - CALLMIND_SERVER_BIND=0.0.0.0:8080
      - CALLMIND_LLM_ENDPOINT=http://ollama:11434
      - CALLMIND_LLM_PROVIDER=ollama
      - CALLMIND_LLM_MODEL=qwen2.5:7b
    depends_on:
      - ollama
    networks:
      - callmind-net

  # ----------------------------------------------------------------------------
  # 2. CallMind (Vulkan GPU - AMD Radeon, Intel Arc, Nvidia)
  # Run via: docker compose --profile vulkan up -d
  # ----------------------------------------------------------------------------
  callmind-vulkan:
    image: ghcr.io/callmind/callmind:vulkan
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ACCELERATION: vulkan
    container_name: callmind-vulkan-server
    # Longer than the binary's own worker-shutdown wait, so the requeue of
    # in-flight jobs actually runs before Docker sends SIGKILL. Docker's
    # default is 10s, which raced the requeue exactly.
    stop_grace_period: 30s
    profiles: ["vulkan"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/dri:/dev/dri # Pass Direct Rendering Infrastructure to container
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./callmind.yaml:/app/callmind.yaml:ro
    environment:
      - RUST_LOG=info
      - CALLMIND_SERVER_BIND=0.0.0.0:8080
      - CALLMIND_LLM_ENDPOINT=http://ollama:11434
      - CALLMIND_LLM_PROVIDER=ollama
      - CALLMIND_LLM_MODEL=qwen2.5:7b
    depends_on:
      - ollama
    networks:
      - callmind-net

  # ----------------------------------------------------------------------------
  # 3. CallMind (Nvidia CUDA GPU)
  # Run via: docker compose --profile cuda up -d
  # ----------------------------------------------------------------------------
  callmind-cuda:
    image: ghcr.io/callmind/callmind:cuda
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: callmind-cuda-server
    # Longer than the binary's own worker-shutdown wait, so the requeue of
    # in-flight jobs actually runs before Docker sends SIGKILL. Docker's
    # default is 10s, which raced the requeue exactly.
    stop_grace_period: 30s
    profiles: ["cuda"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./callmind.yaml:/app/callmind.yaml:ro
    environment:
      - RUST_LOG=info
      - CALLMIND_SERVER_BIND=0.0.0.0:8080
      - CALLMIND_LLM_ENDPOINT=http://ollama:11434
      - CALLMIND_LLM_PROVIDER=ollama
      - CALLMIND_LLM_MODEL=qwen2.5:7b
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - ollama
    networks:
      - callmind-net

  # ----------------------------------------------------------------------------
  # Ollama LLM Server
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: callmind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - callmind-net

volumes:
  ollama-models:

networks:
  callmind-net:
    driver: bridge
