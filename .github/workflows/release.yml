name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate shipping on the same suite CI runs. Tag pushes do not trigger
  # ci.yml at all, so without this a release could ship untested.
  checks:
    uses: ./.github/workflows/checks.yml

  build-binaries:
    needs: checks
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            flags: ""
            binary_name: callmind
            archive_name: callmind-macos-arm64.tar.gz

          - name: linux-x86_64-cpu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: "--no-default-features --features cpu"
            binary_name: callmind
            archive_name: callmind-linux-x86_64.tar.gz

          - name: linux-x86_64-vulkan
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: "--no-default-features --features vulkan"
            binary_name: callmind
            archive_name: callmind-linux-x86_64-vulkan.tar.gz
            apt_packages: "libvulkan-dev glslc libssl-dev"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libclang-dev libopus-dev ${{ matrix.apt_packages }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: Package Binary Archive
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/callmind
          cp callmind.yaml dist/callmind.yaml
          tar -czf ${{ matrix.archive_name }} -C dist callmind callmind.yaml

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
