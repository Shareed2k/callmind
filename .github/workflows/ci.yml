name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Rapid pushes used to stack duplicate (and expensive macOS) runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
