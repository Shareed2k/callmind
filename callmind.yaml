# CallMind Server Configuration Template (YAML)

server:
  bind: "127.0.0.1:8080"
  body_limit_mb: 500

database:
  # "sqlite" or "postgres". One set of repositories serves both -- the queries are
  # built by sea-query and the migration is one definition, so switching backends
  # changes this line and nothing else.
  #   sqlite:   ./data/callmind.db
  #   postgres: postgres://user:password@host:5432/callmind
  driver: "sqlite"
  url: "./data/callmind.db"
  max_connections: 16
  # SQLite only. ponytail: not wired -- pool.rs hardcodes 5 s.
  busy_timeout_ms: 5000

logging:
  # "text" for a terminal, "json" for a log aggregator. Every pipeline stage logs
  # `stage`, `ms` and `call_id` as fields, so "which stage ate the time" is a
  # query rather than a grep.
  format: "text"

storage:
  driver: "filesystem"
  path: "./data/recordings"

jobs:
  # In-process workers. At least one, always: a remote worker offloads
  # transcription and hands the job back as `analyze_call`, and that stage needs
  # the LLM and the database, so it runs here. Lower this when most
  # transcription happens on a GPU box, do not zero it.
  workers: 4
  # Job kinds this host's own workers take. Empty means everything it can
  # handle, which is right for a single machine. Name them to hand transcription
  # to a GPU box -- the local pool polls twice a second and a worker over a
  # network cannot win that race otherwise:
  #   kinds: ["analyze_call", "deliver_webhook"]
  # `analyze_call` must stay in any list: it is the stage a remote worker hands
  # back, and it needs the LLM and the database.
  kinds: []
  poll_interval_ms: 500
  lock_timeout_secs: 600
  max_attempts: 3

models:
  # Base directory for AI models:
  # - STT: ./models/stt/ivrit-ai-large-v3-turbo.bin, ./models/stt/whisper-large-v3.bin
  # - Diarization ONNX: ./models/diarization/speaker_embedding.onnx (PyAnnote, ECAPA-TDNN, or WeSpeaker)
  # - Speaker segmentation (optional): ./models/diarization/segmentation.onnx
  #   With it, the number of speakers is measured from the audio; without it a
  #   two-party call is assumed. Produce it with
  #   `python3 scripts/export_pyannote_segmentation.py --out models/diarization/segmentation.onnx`
  #   -- the published export cannot be loaded by a pure-Rust runtime as-is.
  models_dir: "./models"
  # Speech-to-text weights, relative to models_dir. This is the stage that costs
  # 88.8% of processing time, so it is the one worth experimenting with:
  #   stt/whisper-large-v3-turbo.bin  ~1.5 GB  (default) -- measured 2.2x and
  #     2.9x faster than the full model on two real Russian calls, and the
  #     better transcript on both: the full model lost speech into repetition
  #     loops that turbo did not produce.
  #   stt/whisper-large-v3.bin        ~2.9 GB  (`models download whisper-large-v3`)
  #     the full model; try it if your language transcribes worse on turbo.
  stt_multilingual: "stt/whisper-large-v3-turbo.bin"
  stt_hebrew: "stt/ivrit-ai-large-v3-turbo.bin"

llm:
  provider: "ollama" # "ollama", "openai", "anthropic", "heuristic"
  endpoint: "http://localhost:11434"
  # Recommended models:
  # - Hebrew specialized: "dicta-il/DictaLM-3.0-1.7B-Instruct", "yonioz123/Llama-3.2-3B-Hebrew-Master"
  # - General multilingual: "qwen2.5:7b", "gpt-4o-mini", "claude-3-5-sonnet-20241022"
  # qwen2.5:7b is the default because llama3.2:3b degenerated into a repetition
  # loop on a real Hebrew call -- invalid JSON, 43 s, generation stopped only by
  # the token cap -- where qwen returned a correct Hebrew analysis in 14 s from
  # the same prompt. Smaller models are fine for English; test yours on a real
  # call before trusting it.
  model: "qwen2.5:7b"
  api_key: null
  # Tokens the model is given, sent to Ollama as `num_ctx`. Ollama defaults to a
  # couple of thousand and drops the rest of the prompt without an error -- a
  # 13-minute call formats to roughly 4000 tokens, so half of it was being lost.
  # Raise it if your model and RAM allow; the analyser compresses whatever still
  # does not fit rather than letting it be cut.
  context_tokens: 8192

auth:
  enabled: false
  api_key: null # e.g. "secret-api-key-here" or set CALLMIND_AUTH_API_KEY

bots:
  telegram:
    enabled: false
    bot_token: null # e.g. "123456789:ABCdefGhIJKlmNoPQRstuVWXyz" or set CALLMIND_TELEGRAM_BOT_TOKEN
    allowed_chat_ids: [] # optional: restrict to specific family/user chat IDs

  # Self-hosted Evolution API (https://evolution-api.com) — pairs with an
  # ordinary WhatsApp account over QR, no Meta business verification needed.
  evolution:
    enabled: false
    base_url: null # e.g. "http://localhost:8080" or set CALLMIND_EVOLUTION_BASE_URL
    instance: null # instance name created in Evolution API
    api_key: null # value for the `apikey` header, or set CALLMIND_EVOLUTION_API_KEY
    webhook_token: null # shared secret required on the inbound webhook
    allowed_numbers: [] # optional: restrict to specific senders, digits only
    result_timeout_secs: 600

  webhook:
    enabled: true
    secret_token: null # optional shared secret for incoming audio webhooks (Siri / iOS Shortcuts / n8n)

watcher:
  enabled: false
  watch_dir: "./incoming"
  poll_secs: 5

workers:
  # Remote processing workers: separate programs, possibly closed-source, that
  # lease jobs over gRPC. They never touch the database.
  enabled: false
  # Loopback needs no certificate. Any other address does, and the server
  # refuses to start without one -- a worker downloads recordings.
  bind: "127.0.0.1:8081"
  # tls:
  #   server_cert: "/etc/callmind/server.pem"
  #   server_key: "/etc/callmind/server-key.pem"
  # Each worker pinned to the certificate it presents. Revoking one is deleting
  # its entry.
  # allowed:
  #   - name: "gpu-1"
  #     certificate: "/etc/callmind/gpu-1.pem"
  # Dispatched after every transcript, one job per kind. Named bare here, but a
  # worker leases the kind as "plugin:<name>": "acoustic-emotions" here is
  # "plugin:acoustic-emotions" on the wire. ASCII letters, digits, - and _ only.
  plugin_kinds: []

# POST each finished call to an HTTP receiver (n8n, a Shortcut, anything that
# speaks HTTP). Disabled while url is empty -- this is the one setting that sends
# call content off the machine. Delivery is a queued job, so a receiver that is
# down costs a retry with backoff, not a re-run of transcription.
# Both fields also read CALLMIND_OUTBOUND_WEBHOOK_URL / _SECRET from the
# environment, so the secret need not be written to disk.
outbound_webhook:
  url: ""
  # Sent as X-CallMind-Secret so the receiver can tell the request is ours.
  secret: ""
  timeout_seconds: 30
